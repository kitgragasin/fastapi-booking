name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Unix scripts executable
        if: runner.os != 'Windows'
        run: chmod +x ./run-unit-tests ./run-checks ./init-db

      - name: Run checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run-checks.cmd

      - name: Run checks (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./run-checks